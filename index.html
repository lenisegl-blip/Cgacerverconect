
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGASERVER BOT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
    repeating-linear-gradient(
      45deg,#263d27 0px,#263d27 20px,
      #1d301f 20px,#1d301f 40px
    );
  font-family: Arial, sans-serif;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.app {
  width: 100%;
  max-width: 440px;
  background: #202020;
  border: 4px solid #111;
  box-shadow: 0 0 0 3px #438b3c, 0 15px 40px #000;
  padding: 22px;
  text-align: center;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  color: #63e45b;
  text-shadow: 3px 3px #17471a;
  margin: 8px 0;
}

.subtitle {
  color: #aaa;
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.player {
  background: #303030;
  border: 2px solid #555;
  padding: 18px;
  margin-bottom: 18px;
}

.avatar {
  width: 65px;
  height: 65px;
  margin: auto;
  background: #62b74b;
  border: 4px solid #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
}

.player-name {
  font-size: 21px;
  font-weight: bold;
  margin-top: 12px;
}

.status-box {
  background: #111;
  padding: 14px;
  border: 1px solid #555;
  margin: 15px 0;
}

.status {
  font-weight: bold;
  color: #ffce50;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  background: #e0a52c;
  border-radius: 50%;
  margin-right: 7px;
}

button {
  width: 100%;
  padding: 16px;
  margin: 7px 0;
  border: 3px solid #173c19;
  background: #48a83f;
  color: white;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 4px #205b25;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 1px #205b25;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.stop {
  background: #b33b35;
  border-color: #641c19;
  box-shadow: 0 4px #641c19;
}

.secondary {
  background: #454545;
  border-color: #222;
  box-shadow: 0 4px #111;
}

.info {
  color: #aaa;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 20px;
}

.footer {
  margin-top: 20px;
  font-size: 11px;
  color: #777;
}
</style>
</head>

<body>

<main class="app">

  <div class="logo">CGASERVER</div>
  <div class="subtitle">BEDROCK BOT</div>

  <section class="player">
    <div class="avatar">⛏</div>
    <div class="player-name">CGASERVER</div>
    <div class="info">JOGADOR AUTOMÁTICO</div>
  </section>

  <div class="status-box">
    <span class="dot" id="dot"></span>
    <span class="status" id="status">BOT DESLIGADO</span>
  </div>

  <button id="start" onclick="startBot()">
    ▶ INICIAR BOT
  </button>

  <button class="stop" id="stop" onclick="stopBot()" disabled>
    ■ PARAR BOT
  </button>

  <button class="secondary" onclick="openMinecraft()">
    ABRIR MINECRAFT
  </button>

  <button class="secondary" onclick="showInfo()">
    INFORMAÇÕES
  </button>

  <div class="info" id="message">
    Aguardando comando.
  </div>

  <div class="footer">
    CGASERVER BOT • PROJETO BEDROCK
  </div>

</main>

<script>
let running = false;

function updateStatus(text, color) {
  document.getElementById("status").textContent = text;
  document.getElementById("dot").style.background = color;
}

function startBot() {
  if (running) return;

  running = true;

  updateStatus("ABRINDO MINECRAFT...", "#e0a52c");

  document.getElementById("message").textContent =
    "Tentando abrir o Minecraft. O bot ainda não entrou no mundo.";

  document.getElementById("start").disabled = true;
  document.getElementById("stop").disabled = false;

  openMinecraft();
}

function stopBot() {
  running = false;

  updateStatus("BOT DESLIGADO", "#e05252");

  document.getElementById("message").textContent =
    "O programa parou de tentar abrir o Minecraft.";

  document.getElementById("start").disabled = false;
  document.getElementById("stop").disabled = true;
}

function openMinecraft() {
  window.location.href = "minecraft://";
}

function showInfo() {
  document.getElementById("message").textContent =
    "Esta é a interface do CGASERVER BOT. Para entrar automaticamente como jogador, ainda é necessário integrar um cliente Bedrock real.";
}
</script>

</body>
</html>
